<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AI 學習教練 · 回饋儀表板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,900;1,9..144,500&family=Noto+Sans+TC:wght@300;400;500;700;900&family=Noto+Serif+TC:wght@500;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#F4EFE3;font-family:'Noto Sans TC','Microsoft JhengHei',sans-serif;color:#191512;line-height:1.85;font-size:16px;-webkit-font-smoothing:antialiased;min-height:100vh}
body::before{content:"";position:fixed;inset:0;background-image:linear-gradient(rgba(25,21,18,0.06) 1px,transparent 1px),linear-gradient(90deg,rgba(25,21,18,0.06) 1px,transparent 1px);background-size:34px 34px;pointer-events:none;z-index:0;opacity:.45}
.wrap{max-width:1100px;margin:0 auto;padding:40px 28px 80px;position:relative;z-index:1}
.masthead{border-bottom:3px solid #191512;padding-bottom:28px;margin-bottom:36px}
.masthead .tag{font-family:Consolas,'Courier New',monospace;font-size:11px;letter-spacing:.18em;color:#4C453D;margin-bottom:18px}
.masthead .dot{display:inline-block;width:8px;height:8px;background:#D63A0F;border-radius:50%;margin-right:7px;vertical-align:middle}
.masthead h1{font-family:Georgia,'Noto Serif TC',serif;font-weight:900;font-size:32px;line-height:1.2;margin:0 0 6px}
.masthead .meta{font-size:15px;color:#4C453D}

/* ── Stat cards ── */
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin:0 0 28px}
.stat-card{background:#ECE5D4;border:1px solid rgba(25,21,18,0.1);padding:20px 22px;text-align:center}
.stat-card .num{font-family:Georgia,'Noto Serif TC',serif;font-weight:900;font-size:36px;color:#D63A0F;line-height:1.1;margin-bottom:4px}
.stat-card .lbl{font-size:14px;color:#4C453D}

/* ── Chart grid ── */
.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:0 0 28px}
.chart-full{grid-column:1 / -1}
.chart-box{background:#F4EFE3;border:1px solid rgba(25,21,18,0.12);padding:20px}
.chart-box h3{font-family:Georgia,'Noto Serif TC',serif;font-weight:700;font-size:18px;margin:0 0 14px;display:flex;align-items:center;gap:8px}
.chart-box h3 .tag-sm{font-family:Consolas,monospace;font-size:11px;color:#D63A0F;font-weight:400}
.chart-box .chart-wrap{position:relative;height:260px}
.chart-box .chart-wrap.tall{height:340px}
.chart-box .chart-wrap.full{height:400px}
.chart-box .chart-wrap canvas{width:100%!important;height:100%!important}

/* ── Table ── */
.table-wrap{overflow-x:auto;margin:16px 0 0}
table{width:100%;border-collapse:collapse;font-size:14px}
th{background:#191512;color:#F4EFE3;text-align:left;padding:10px 12px;font-weight:600;white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid rgba(25,21,18,0.08);vertical-align:top}
tr:hover td{background:rgba(25,21,18,0.04)}
.feedback-text{max-width:400px;white-space:pre-wrap}

/* ── Controls ── */
.controls{display:flex;gap:12px;align-items:center;margin-bottom:24px;flex-wrap:wrap}
.controls button{background:#D63A0F;color:#F4EFE3;border:none;padding:10px 22px;font-family:'Noto Sans TC',sans-serif;font-weight:700;font-size:14px;border-radius:4px;cursor:pointer;transition:background 0.2s}
.controls button:hover{background:#A82B07}
.controls button.sec{background:#1E5C5A}
.controls button.sec:hover{background:#143D3B}
.controls .info{font-size:14px;color:#7A7165;margin-left:auto}

.refresh-note{text-align:center;padding:40px;color:#7A7165;font-size:15px}

@media(max-width:720px){
  .chart-grid{grid-template-columns:1fr}
  .stats-row{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="masthead">
    <div class="tag"><span class="dot"></span>HTC 硬體 R&amp;D · 課程回饋後臺</div>
    <h1>回饋收集儀表板</h1>
    <p class="meta" id="header-meta">載入中⋯</p>
  </div>

  <div class="controls">
    <button id="btn-refresh" onclick="loadData()">⟳ 重新整理</button>
    <button class="sec" onclick="exportCSV()">⬇ 匯出 CSV</button>
    <span class="info" id="last-refresh"></span>
  </div>

  <!-- Stat cards -->
  <div class="stats-row" id="stat-cards"></div>

  <!-- Charts -->
  <div class="chart-grid" id="charts"></div>

  <!-- Raw responses table -->
  <div class="chart-box chart-full" id="raw-table">
    <h3>💬 逐筆回覆含「在想說的話」 <span class="tag-sm">(最近 50 筆)</span></h3>
    <div class="table-wrap" id="table-body"><p style="color:#7A7165;text-align:center;padding:20px;">載入中⋯</p></div>
  </div>
</div>

<script>
const COLORS = {
  vermilion: '#D63A0F',
  ink: '#191512',
  petrol: '#1E5C5A',
  paper: '#F4EFE3',
  paper2: '#ECE5D4'
};

let chartInstances = {};

function getColor(i) {
  const palette = ['#D63A0F','#1E5C5A','#4C453D','#7A7165','#A82B07','#C8BFB0','#191512','#143D3B'];
  return palette[i % palette.length];
}

function loadData() {
  document.getElementById('header-meta').textContent = '載入中⋯';

  fetch('/api/stats')
    .then(r => r.json())
    .then(stats => {
      renderStats(stats);
      renderCharts(stats);
      document.getElementById('last-refresh').textContent = '更新時間：' + new Date().toLocaleTimeString('zh-TW');
      document.getElementById('header-meta').textContent =
        `共 ${stats.total} 份回饋 · 最後更新 ${new Date().toLocaleString('zh-TW')}`;
    })
    .catch(() => {
      document.getElementById('header-meta').textContent = '⚠️ 無法連線到伺服器';
      document.querySelector('.stats-row').innerHTML =
        '<div class="refresh-note" style="grid-column:1/-1;">⚠️ 伺服器未啟動？請執行 <code>python3 server.py</code></div>';
    });

  // Load raw responses with open_feedback
  fetch('/data/responses')
    .then(r => r.json())
    .then(renderRawResponses)
    .catch(() => {
      document.getElementById('table-body').innerHTML = '<p style="color:#7A7165;text-align:center;padding:20px;">⚠️ 無法載入回應資料</p>';
    });
}

function renderStats(stats) {
  const row = document.getElementById('stat-cards');
  row.innerHTML = `
    <div class="stat-card"><div class="num">${stats.total}</div><div class="lbl">📋 總回覆數</div></div>
    <div class="stat-card"><div class="num" style="font-size:28px;">${stats.overall_avg || '-'}</div><div class="lbl">⭐ 平均滿意度</div></div>
    <div class="stat-card"><div class="num">${Object.keys(stats.difficulty || {}).length || 0}</div><div class="lbl">🎯 難度分布項數</div></div>
    <div class="stat-card"><div class="num">${Object.keys(stats.role || {}).length || 0}</div><div class="lbl">👥 參與角色數</div></div>
  `;
}

function renderCharts(stats) {
  // Destroy existing charts
  Object.values(chartInstances).forEach(c => { try { c.destroy(); } catch(e) {} });
  chartInstances = {};

  const container = document.getElementById('charts');
  container.innerHTML = '';

  const total = stats.total;
  if (total === 0) {
    container.innerHTML = '<div class="refresh-note" style="grid-column:1/-1;">📭 尚未收到任何回饋</div>';
    return;
  }

  // ── Charts to render ──
  const charts = [
    { id: 'overall', title: '⭐ 整體滿意度', type: 'bar', data: stats.overall, tall: false },
    { id: 'difficulty', title: '🎯 難易度分布', type: 'bar', data: stats.difficulty, tall: false },
    { id: 'strengthen', title: '📊 希望強化的方向', type: 'bar', data: stats.strengthen, tall: false, horizontal: true },
    { id: 'length', title: '⏱ 每日長度', type: 'bar', data: stats.length, tall: false },
    { id: 'favorite', title: '❤️ 最喜歡的環節', type: 'bar', data: stats.favorite, tall: false },
    { id: 'format', title: '📬 希望的輔助形式', type: 'bar', data: stats.format, tall: false, horizontal: true },
    { id: 'role', title: '👥 參與角色', type: 'bar', data: stats.role, tall: false },
    { id: 'days', title: '👍 最有幫助 vs 👎 最不需要的 Day', type: 'days', data: { best: stats.bestDay || {}, worst: stats.worstDay || {} }, tall: true, full: true },
  ];

  charts.forEach((c, idx) => {
    const div = document.createElement('div');
    div.className = 'chart-box' + (c.full ? ' chart-full' : '');
    div.id = 'chart-' + c.id;

    let titleHtml = `<h3>${c.title}</h3>`;
    div.innerHTML = titleHtml + `<div class="chart-wrap${c.tall ? ' tall' : ''}${c.full ? ' full' : ''}"><canvas id="canvas-${c.id}"></canvas></div>`;
    container.appendChild(div);

    const ctx = document.getElementById('canvas-' + c.id).getContext('2d');

    if (c.type === 'days') {
      renderDaysChart(ctx, c.data, c.id);
    } else if (c.type === 'bar') {
      renderBarChart(ctx, c.data, c.id, c.horizontal);
    }
  });
}

function renderBarChart(ctx, data, id, horizontal) {
  const labels = Object.keys(data);
  const values = Object.values(data);
  if (labels.length === 0) { ctx.canvas.parentElement.innerHTML = '<p style="text-align:center;color:#7A7165;padding:40px;">尚無資料</p>'; return; }

  const labelMap = {
    'too-easy':'太簡單','just-right':'適中','too-hard':'太難','mixed':'不穩定',
    'too-short':'太短','too-long':'太長','varies':'不一定',
    'oneline':'一句話重點','why':'為什麼有用','steps':'操作步驟','practice':'🎯練習','tip':'💡撇步','safety':'🔒安全',
    'ee':'EE','power':'Power','rf':'RF/天線','pcb':'PCB','audio':'Audio','camera':'Camera','display':'Display',
    'me':'機構','qa':'QA','pm':'PM','other':'其他','':'未填',
    'excel':'Excel','word':'Word','ppt':'PPT','email':'Email','translate':'翻譯','compare':'比較/分析',
    'research':'查證','report':'週報','code':'程式碼','prompt':'Prompt','security':'資安','meeting':'會議',
    'email-only':'Email就好','video':'影片','group':'小組','cheatsheet':'速查卡','quiz':'測驗','dashboard':'儀表板'
  };
  const displayLabels = labels.map(l => labelMap[l] || l);

  chartInstances[id] = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: displayLabels,
      datasets: [{
        data: values,
        backgroundColor: values.map((_, i) => getColor(i)),
        borderRadius: 3,
      }]
    },
    options: {
      indexAxis: horizontal ? 'y' : 'x',
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: (c) => c.raw + ' 人 (' + Math.round(c.raw / Math.max(...values) * 100) + '%)'
          }
        }
      },
      scales: {
        y: { beginAtZero: true, ticks: { stepSize: 1, precision: 0 } }
      }
    }
  });
}

function renderDaysChart(ctx, data, id) {
  const allDays = {};
  for (let d = 1; d <= 20; d++) {
    allDays['Day ' + d] = { best: 0, worst: 0 };
  }
  Object.entries(data.best || {}).forEach(([k, v]) => { if (allDays['Day ' + k]) allDays['Day ' + k].best = v; });
  Object.entries(data.worst || {}).forEach(([k, v]) => { if (allDays['Day ' + k]) allDays['Day ' + k].worst = v; });

  const labels = Object.keys(allDays);
  const bestVals = Object.values(allDays).map(d => d.best);
  const worstVals = Object.values(allDays).map(d => d.worst);

  if (bestVals.every(v => v === 0) && worstVals.every(v => v === 0)) {
    ctx.canvas.parentElement.innerHTML = '<p style="text-align:center;color:#7A7165;padding:40px;">尚無資料</p>';
    return;
  }

  chartInstances[id] = new Chart(ctx, {
    type: 'bar',
    data: {
      labels,
      datasets: [
        { label: '👍 最有幫助', data: bestVals, backgroundColor: '#1E5C5A', borderRadius: 3 },
        { label: '👎 最不需要', data: worstVals, backgroundColor: '#D63A0F', borderRadius: 3 }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { position: 'top', labels: { font: { size: 13 } } },
        tooltip: { callbacks: { label: (c) => c.dataset.label + ': ' + c.raw + ' 人' } }
      },
      scales: {
        x: { ticks: { font: { size: 11 } } },
        y: { beginAtZero: true, ticks: { stepSize: 1, precision: 0 } }
      }
    }
  });
}

function renderRawResponses(rows) {
  const container = document.getElementById('table-body');
  if (!Array.isArray(rows) || rows.length === 0) {
    container.innerHTML = '<p style="color:#7A7165;text-align:center;padding:20px;">📭 尚無回覆資料</p>';
    return;
  }

  const roleLabels = {
    'ee':'EE','power':'Power','rf':'RF/天線','pcb':'PCB','audio':'Audio',
    'camera':'Camera','display':'Display','me':'機構','qa':'QA','pm':'PM','other':'其他'
  };
  const diffLabels = {
    'too-easy':'太簡單','just-right':'適中','too-hard':'太難','mixed':'不穩定'
  };
  const lenLabels = {
    'too-short':'太短','just-right':'適中','too-long':'太長','varies':'不一定'
  };

  let html = `<table>
    <tr>
      <th>#</th>
      <th>⭐</th>
      <th>難度</th>
      <th>長度</th>
      <th>最喜歡</th>
      <th>角色</th>
      <th>💬 在想說的話</th>
      <th>時間</th>
    </tr>`;

  rows.slice(0, 50).forEach((r, i) => {
    const stars = '★'.repeat(r.overall || 0) + '☆'.repeat(5 - (r.overall || 0));
    const diff = diffLabels[r.difficulty] || r.difficulty || '-';
    const len = lenLabels[r.length] || r.length || '-';
    const favMap = {'oneline':'一句話','why':'為什麼有用','steps':'步驟','practice':'🎯練習','tip':'💡撇步','safety':'🔒安全'};
    const fav = favMap[r.favorite] || r.favorite || '-';
    const role = roleLabels[r.role] || r.role || '-';
    const feedback = (r.open_feedback || '').trim();
    const time = r.submitted_at ? new Date(r.submitted_at).toLocaleString('zh-TW', {month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}) : '-';

    html += `<tr>
      <td>${r.id || i+1}</td>
      <td style="color:#D63A0F;">${stars}</td>
      <td>${diff}</td>
      <td>${len}</td>
      <td>${fav}</td>
      <td>${role}</td>
      <td class="feedback-text">${feedback || '<span style="color:#C8BFB0;">—</span>'}</td>
      <td style="color:#7A7165;font-size:12px;white-space:nowrap;">${time}</td>
    </tr>`;
  });

  html += '</table>';
  container.innerHTML = html;
}

function exportCSV() {
  window.open('/data/responses', '_blank');
}

// ── Auto-refresh every 60s ──
loadData();
setInterval(loadData, 60000);
</script>
</body>
</html>
